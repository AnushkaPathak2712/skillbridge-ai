<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up · SkillBridge AI</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        * { font-family: 'Inter', sans-serif; }
        .bg-accent { background: #4f46e5; }
        .bg-accent-dark { background: #4338ca; }
        .bg-accent-light { background: #eef2ff; }
        .text-accent { color: #4f46e5; }
        .hover\:bg-accent:hover { background: #4338ca; }
        .border-accent { border-color: #4f46e5; }
        
        .role-card {
            transition: all 0.2s ease;
            cursor: pointer;
            border: 2px solid #e5e7eb;
        }
        .role-card:hover { border-color: #4f46e5; }
        .role-card.selected { border-color: #4f46e5; background: #eef2ff; }
        .role-card input[type="radio"] { display: none; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    
    <div class="w-full max-w-md px-6 py-8">
        <div class="text-center mb-8">
            <div class="flex items-center justify-center gap-2 mb-2">
                <div class="w-8 h-8 bg-accent rounded-lg flex items-center justify-center text-white text-sm font-bold">SB</div>
                <span class="text-2xl font-bold tracking-tight">SkillBridge</span>
            </div>
            <p class="text-sm text-gray-500">Create your account</p>
        </div>
        
        <div class="bg-white border border-gray-200 rounded-xl shadow-sm p-8">
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="mb-4 p-3 rounded-lg text-sm {% if category == 'success' %}bg-emerald-50 text-emerald-700 border border-emerald-200{% else %}bg-red-50 text-red-700 border border-red-200{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            
            <form method="POST" action="/signup" id="signupForm">
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Full name</label>
                    <input type="text" name="name" required 
                           class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-accent/50 focus:border-accent transition-all"
                           placeholder="Anushka Pathak">
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
                    <input type="email" name="email" required 
                           class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-accent/50 focus:border-accent transition-all"
                           placeholder="you@example.com">
                </div>
                
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
                    <input type="password" name="password" required 
                           class="w-full px-3.5 py-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-accent/50 focus:border-accent transition-all"
                           placeholder="Create a password">
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">I am a</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="role-card rounded-lg p-4 text-center cursor-pointer selected" onclick="selectRole(this)">
                            <input type="radio" name="role" value="student" checked>
                            <div class="text-3xl mb-1.5">👨‍🎓</div>
                            <div class="font-semibold text-gray-800">Student</div>
                            <div class="text-xs text-gray-400">For MCA students</div>
                        </label>
                        <label class="role-card rounded-lg p-4 text-center cursor-pointer" onclick="selectRole(this)">
                            <input type="radio" name="role" value="faculty">
                            <div class="text-3xl mb-1.5">👨‍🏫</div>
                            <div class="font-semibold text-gray-800">Faculty</div>
                            <div class="text-xs text-gray-400">For educators</div>
                        </label>
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-accent text-white py-2.5 rounded-lg font-semibold hover:bg-accent-dark transition-all shadow-sm shadow-accent/20 text-sm">
                    Create account <i class="fa-solid fa-arrow-right ml-2 text-xs"></i>
                </button>
            </form>
            
            <div class="mt-4 text-center text-sm text-gray-500">
                Already have an account? <a href="/login" class="text-accent hover:text-accent-dark font-semibold transition-colors">Sign in</a>
            </div>
        </div>
        
        <div class="text-center mt-6">
            <a href="/" class="text-sm text-gray-400 hover:text-gray-600 transition-colors">
                <i class="fa-solid fa-arrow-left mr-1"></i> Back to home
            </a>
        </div>
    </div>
    
    <script>
        function selectRole(el) {
            document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            el.querySelector('input[type="radio"]').checked = true;
        }
    </script>
</body>
</html>
